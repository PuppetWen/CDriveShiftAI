name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:native
      - run: npm run build:main
      - run: npm run build:web
      - run: node scripts/smoke-explorer-launch.mjs
      - run: node scripts/smoke-force-delete-cwd.mjs
