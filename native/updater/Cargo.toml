[package]
name = "cshift-updater"
version = "0.0.5"
edition = "2021"
description = "Transactional Windows updater for CDriveShiftAI"

[dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
sha2 = "0.10.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
  "Win32_Foundation",
  "Win32_System_Threading"
] }
